name: Build Gameram site
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/materialize-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download exact Figma assets
        shell: bash
        run: |
          bash scripts/assets-light.sh
          bash scripts/assets-dark.sh

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build
          touch docs/.nojekyll

      - name: Commit built Pages site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gameram-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then
            echo 'No build changes'
            exit 0
          fi
          git commit -m 'Build all Gameram pages from Figma DOM'
          git push
